<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The GHJ Setup</title>

<style>
body {
  background-color: #008080;
  font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
}

.window {
  width: 460px;
  margin: 120px auto;
  background: #c0c0c0;
  border: 2px solid #000;
  box-shadow: 4px 4px #404040;
}

.title-bar {
  background: #000080;
  color: white;
  padding: 4px;
  font-weight: bold;
  display: flex;
  align-items: center;
}

.title-bar img {
  width: 16px;
  height: 16px;
  margin-right: 6px;
}

.content {
  padding: 20px;
  font-size: 14px;
}

.progress {
  width: 100%;
  height: 18px;
  background: white;
  border: 1px solid #000;
  margin-top: 10px;
  display: none;
}

.bar {
  height: 100%;
  width: 0%;
  background: #000080;
}

.buttons {
  text-align: right;
  margin-top: 20px;
}

button {
  font-family: "MS Sans Serif";
  font-size: 14px;
  padding: 4px 20px;
  background: #c0c0c0;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #404040;
  border-bottom: 2px solid #404040;
  cursor: pointer;
}

button:active {
  border-top: 2px solid #404040;
  border-left: 2px solid #404040;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}
</style>
</head>

<body>

<div class="window">
  <div class="title-bar">
    <img src="icon.ico" alt="">
    The GHJ Setup
  </div>

  <div class="content">
    <p>This wizard will install the setup on your computer.</p>
    <p>Click Install to continue.</p>

    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div class="buttons">
      <button id="installBtn" onclick="install()">Install</button>
      <button onclick="alert('Setup cancelled');">Cancel</button>
    </div>
  </div>
</div>

<audio id="sound" src="win98.wav"></audio>

<script>
function install() {
  document.getElementById("installBtn").disabled = true;
  document.getElementById("installBtn").innerText = "Installing...";
  document.getElementById("progress").style.display = "block";

  // sonido opcional
  const snd = document.getElementById("sound");
  if (snd) snd.play();

  let bar = document.getElementById("bar");
  let width = 0;

  let interval = setInterval(() => {
    width += 5;
    bar.style.width = width + "%";
    if (width >= 100) {
      clearInterval(interval);
      window.location.href = "The-GHJ-Setup.exe";
    }
  }, 150);
}
</script>

</body>
</html>
